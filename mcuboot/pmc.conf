# MCUboot for the Portenta Machine Control Explorer.
#
# tools/build.ps1 -Mcuboot lists this file and then pmc-key.conf, in that
# order, and the order matters. The flash map comes from pmc.overlay, which
# includes the same pmc-partitions.dtsi the application includes. The reasoning
# behind every value here is in docs/OTA.md.

# Scratch, not move: the slots have 128 KB and 4 KB sectors and move fails
# silently on that. Set explicitly - the default would be right for the wrong
# reason, from a node this project deletes.
CONFIG_BOOT_SWAP_USING_SCRATCH=y

# Must cover the SECONDARY slot's 320 QSPI sectors, not the primary's 10, and
# must stay equal to the zephyr_compile_definitions() value in
# app/CMakeLists.txt.
CONFIG_BOOT_MAX_IMG_SECTORS_AUTO=n
CONFIG_BOOT_MAX_IMG_SECTORS=512

CONFIG_BOOT_SIGNATURE_TYPE_ECDSA_P256=y
CONFIG_BOOT_ECDSA_TINYCRYPT=y

# No console in the shipping bootloader. CONFIG_CONSOLE=n and
# CONFIG_BOARD_SERIAL_BACKEND_CDC_ACM=n come from the command line, the only
# place they reliably beat the board's defconfig. pmc-rtt.conf adds RTT when a
# swap has to be debugged.
CONFIG_BOOT_BANNER=n
CONFIG_TIMESLICING=n
CONFIG_MULTITHREADING=y

CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_MPU_ALLOW_FLASH_WRITE=y

# slot1 lives on the QSPI NOR. Not CONFIG_SPI - this is its own driver on the
# QUADSPI peripheral.
CONFIG_FLASH_STM32_QSPI=y

# Fail-closed: this path does not exist, so a build that was not given the real
# key fails instead of falling back to MCUboot's published sample key.
# pmc-key.conf overrides it and is listed LAST so it wins.
CONFIG_BOOT_SIGNATURE_KEY_FILE="MISSING-pmc-key.conf--see-docs-OTA.md.pem"
