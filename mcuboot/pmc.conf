# MCUboot for the Portenta Machine Control Explorer.
#
# Built out-of-tree against the workspace's bootloader/mcuboot/boot/zephyr.
# tools/build.ps1 -Mcuboot is the invocation; it lists this file and then
# pmc-key.conf, in that order, and the order matters - see the key section at
# the bottom.
#
# The flash map comes from pmc.overlay, which includes the SAME
# pmc-partitions.dtsi the application includes. If these two ever disagree
# about where a slot begins, nothing fails loudly: MCUboot writes, validates
# and swaps at addresses the application does not share, and the symptom is a
# corrupt image or a silently ignored update rather than a build error.

# --- Swap strategy ----------------------------------------------------------
#
# SCRATCH, not MOVE, and this was learned the hard way on the Giga - the same
# SoC with the same asymmetric layout.
#
# The two slots have heterogeneous geometry: 128 KB sectors in internal flash
# against 4 KB in the QSPI NOR, so 10 sectors against 320. swap-using-move's
# boot_slots_compatible() requires equal sector counts AND equal sector sizes,
# fails both, and FAILS SILENTLY: the update is uploaded, marked pending, the
# board resets, and MCUboot simply boots the old image again with no error
# anywhere.
#
# Overwrite-only would be smaller still and would give no way back from an
# image that does not boot, which is the one property this has to keep.
#
# Set explicitly even though it may be the default here. MCUboot's choice
# defaults to scratch when a scratch_partition nodelabel is enabled, and the
# Portenta board does enable one - internally, at 0x08010000, sharing erase
# sector 0 with the bootloader. Relying on that default would be relying on
# the right answer for the wrong reason, with a node we delete.
CONFIG_BOOT_SWAP_USING_SCRATCH=y

# --- Sector ceiling ---------------------------------------------------------
#
# The ceiling must cover the SECONDARY slot's 320 QSPI sectors, not the
# primary's 10. BOOT_MAX_IMG_SECTORS_AUTO derives it from the first image's
# partition, which on an asymmetric layout like this one is the wrong end.
#
# MUST stay equal to the zephyr_compile_definitions() value in
# app/CMakeLists.txt. The application writes the image trailer through
# img_mgmt, so it has to agree about where that trailer begins, and the symbol
# exists only in MCUboot's Kconfig - never in the application's.
CONFIG_BOOT_MAX_IMG_SECTORS_AUTO=n
CONFIG_BOOT_MAX_IMG_SECTORS=512

# --- Signature --------------------------------------------------------------
#
# ECDSA P-256: smaller signatures, smaller verification code, and it is what
# the Giga port already uses, so there is one less thing different between two
# boards on the same bench.
CONFIG_BOOT_SIGNATURE_TYPE_ECDSA_P256=y
CONFIG_BOOT_ECDSA_TINYCRYPT=y

# --- Size and silence -------------------------------------------------------
#
# No console in the shipping bootloader. CONFIG_CONSOLE=n and
# CONFIG_BOARD_SERIAL_BACKEND_CDC_ACM=n are passed on the command line by
# build.ps1 rather than set here, because they have to override the BOARD's
# defconfig and a prj-level fragment does not reliably win that.
#
# Note it must be BOARD_SERIAL_BACKEND_CDC_ACM=n and NOT merely
# UART_CONSOLE=n: this board sources
# boards/common/usb/Kconfig.cdc_acm_serial.defconfig and chooses
# board_cdc_acm_uart as console, shell and mcumgr UART. Turning off only
# UART_CONSOLE leaves uart_console.c compiled against a console device MCUboot
# never instantiates, and the LINK fails on an undefined __device_dts_ord_NNN.
#
# pmc-rtt.conf gives it a console over SEGGER RTT when a swap has to be
# debugged. That is the only way to see why an upgrade was refused, because a
# bootloader with no console declines in silence.
# NOT CONFIG_LOG=n. Turning logging off outright fought MCUboot's own config,
# which sets MCUBOOT_LOG_LEVEL_INF and LOG_MODE_MINIMAL, and produced three
# Kconfig warnings on every single build. Warnings that appear on every build
# are how a real warning gets missed, and the logging costs nothing here
# anyway: CONFIG_CONSOLE=n on the command line means there is no backend for it
# to reach, and pmc-rtt.conf is what gives it one when a swap has to be
# debugged.
CONFIG_BOOT_BANNER=n
CONFIG_TIMESLICING=n
CONFIG_MULTITHREADING=y

# --- Flash ------------------------------------------------------------------
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_MPU_ALLOW_FLASH_WRITE=y

# The secondary slot is on the QSPI NOR, so the bootloader needs that driver
# and its bus. Easy to forget: without it the slot simply never has an image
# in it, which looks exactly like nothing having been uploaded.
# NOT CONFIG_SPI. The QSPI NOR is driven by FLASH_STM32_QSPI, which is its own
# flash driver on the QUADSPI peripheral and does not go through the SPI
# subsystem at all. Enabling SPI produced only
#
#   CMake Warning: No SOURCES given to Zephyr library: drivers__spi
#   Excluding target from build.
#
# i.e. an empty library, which is the tell that the symbol was doing nothing.
CONFIG_FLASH_STM32_QSPI=y

# --- THE KEY, AND THE GUARD ON IT -------------------------------------------
#
# This placeholder path does not exist, deliberately, so that a build which has
# not been given the real key FAILS instead of quietly succeeding.
#
# MCUboot's own default for ECDSA-P256 is root-ec-p256.pem, which is COMMITTED
# IN THE MCUBOOT REPOSITORY and therefore published: anyone can sign an image
# that a bootloader built with it will accept. And falling back to it is easy
# to do by accident, because pmc-key.conf is gitignored - so `git clean -xdf`
# deletes it and the next build picks up the sample key. Measured on the Giga:
# that build SUCCEEDS, emits one warning line among hundreds of lines of build
# output, and produces a bootloader that flashes and runs.
#
# mcuboot/pmc-key.conf overrides this with the real path and is listed LAST on
# the command line so that it wins. KEEP THAT ORDERING.
#
# The application half is deliberately NOT guarded this way: if the app signs
# with the wrong key the bootloader simply refuses the image, which is a
# visible, safe failure. It is the bootloader half that fails open.
CONFIG_BOOT_SIGNATURE_KEY_FILE="MISSING-pmc-key.conf--see-mcuboot-README.pem"
