# Portenta Machine Control Explorer - application configuration.
#
# The reasoning behind these values is in docs/CONFIG.md, section by section,
# under the same headings. Anything here that looks arbitrary was paid for.

CONFIG_MAIN_STACK_SIZE=8192
# 2048 measured 75% used on the running board, and the net stack queues work
# here. A sibling Zephyr board on this bench with the same SoC and radio, up
# for 41 h, uses 4096. docs/MEASURED.md.
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096

# WHD allocates from the SYSTEM heap in its SDIO data path - an MTU-sized
# buffer and a cache-alignment buffer per transfer - so a short heap drops
# packets under sustained load. CONFIG_HEAP_MEM_POOL_SIZE is only a requested
# MINIMUM: subsystems add to it, and the adds alone gave ~22.8 KB here against
# the working sibling's ~55 KB. Runtime stats so this is measurable, not
# argued.
#
# RAISED TO 128 KB SO THE USER HAS SOMETHING TO SPEND. This is the pool an
# armed RS485 capture draws on, and it is shared - WHD, getaddrinfo and the
# capture all come out of the same heap, so it is a budget rather than a
# reservation for one feature. A static ring of the same size would serve
# RS485 and nothing else.
#
# It is mostly not new RAM. COMMON_LIBC_MALLOC_ARENA_SIZE is -1, so whatever
# is not claimed statically becomes the libc arena, and nothing in this
# application calls libc malloc. Moving that leftover into the kernel heap
# makes it allocatable AND reportable: sys_heap_runtime_stats_get can see this
# pool, and cannot see the arena. docs/ARCHITECTURE.md.
CONFIG_HEAP_MEM_POOL_SIZE=131072
CONFIG_SYS_HEAP_RUNTIME_STATS=y

# A fatal error resets the board rather than halting it: no console to halt to.
CONFIG_RESET_ON_FATAL_ERROR=y

# --- Console and shell ------------------------------------------------------
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_LOG=y

# DIAGNOSTIC BUILD - not the shipping configuration.
#
# DEFERRED, and immediate mode is a TRAP on this board.
#
# Immediate writes each line synchronously from the calling thread. The console
# is USB CDC, so when no host is draining the endpoint that write BLOCKS - and
# with the whole net stack at level 4 the flood starts during boot. Measured
# 2026-11-17: the board wedged before WiFi came up and stopped enumerating USB
# altogether, so the console needed to recover it was the thing that killed it.
# A capture cannot be attached earlier than that, because the port does not
# exist until USB enumerates.
#
# Deferred can DROP under overflow, so absence of a line is not evidence - but
# it never blocks, which is the property that matters more here. The buffer is
# sized to the log level below.
CONFIG_LOG_MODE_DEFERRED=y
# 2 KB. It was 4 KB to survive the net-stack-at-debug build, where 16 KB
# overflowed RAM by 8,096 bytes and 8 KB left 96 BYTES of malloc arena. With
# the per-module debug gone the volume is a small fraction of that, so the
# other 2 KB goes back to the heap the user spends.
CONFIG_LOG_BUFFER_SIZE=2048
CONFIG_LOG_PROCESS_THREAD_SLEEP_MS=10

# DEFAULT STAYS AT INFO, and raising it was a mistake worth recording.
#
# smp_udp has no log symbol of its own - it registers as
# LOG_MODULE_REGISTER(smp_udp) with no level - so the default was raised to 4
# to make it verbose. MEASURED: smp_udp.c contains ZERO LOG_DBG calls (15
# LOG_ERR, 1 LOG_INF), so that bought nothing, while raising 75 modules to
# debug. Two of those floods overflowed the buffer and discarded the net-stack
# lines we were after: first the kernel and MPU, then - worse - UDC_DRIVER,
# which logs every USB endpoint transfer while the console IS USB. That is a
# feedback loop: each log line generates the traffic that generates the next.
#
# img_mgmt has 1 LOG_DBG and smp.c has none, so mcumgr debug is near-empty
# too. The signal lived entirely in the NET_* modules, which were raised one at
# a time while that was the question - see the block below for how, and what it
# cost.
CONFIG_LOG_DEFAULT_LEVEL=3

# The whole net stack. Every NET_*_LOG_LEVEL defaults to 0 while NET_LOG is
# unset (Kconfig.template.log_config.net: "default 0 if ... || !NET_LOG"), so
# without this a datagram dropped inside IP or L2 is reported by nothing at
# any level. With it they follow LOG_DEFAULT_LEVEL above.
CONFIG_NET_LOG=y

# NO PER-MODULE DEBUG. The net-stack-at-debug build that found the boot-time
# stalls and then the lost OTA datagram is finished; with NET_LOG above the
# modules follow LOG_DEFAULT_LEVEL, so errors and warnings still appear and the
# per-packet trace does not.
#
# WHAT IT COST, so the next person raising it knows what to expect. NET_PKT at
# debug was 65% of 670,000 lines and dropped more messages than it kept
# (781,997 dropped in 8,221 events), because it logs every allocation, ref,
# unref and frag of every packet. It also costs 14 KB of RAM: NET_PKT_LOG_LEVEL
# at debug selects NET_DEBUG_NET_PKT_ALLOC, whose table is sized
# NET_BUF_RX_COUNT + NET_BUF_TX_COUNT.
#
# HOW TO RAISE IT AGAIN, which is not obvious:
#
#  - Name the modules one at a time (CONFIG_NET_CORE_LOG_LEVEL_DBG=y and so
#    on), and leave NET_PKT out unless packet lifetimes are the question.
#    Raising LOG_DEFAULT_LEVEL to 4 instead drags in 75 modules, among them
#    UDC_DRIVER, which logs every USB endpoint transfer while the console IS
#    USB - a feedback loop where each line generates the traffic that
#    generates the next. That produced an 82 MB log with nothing usable in it.
#  - Use the CHOICE symbol, never the int: <MODULE>_LOG_LEVEL is derived in
#    Kconfig.template.log_config and assigning it fails the build with "not
#    directly user-assignable".
#  - Do not bother with mcumgr: smp_udp.c has ZERO LOG_DBG calls, img_mgmt has
#    one, smp.c none. The signal was entirely in the NET_* modules.
#  - A console line can be DROPPED rather than printed, and that has already
#    misled once: the /ota token diagnostic never appeared under the NET_PKT
#    flood. Put a diagnostic where its reader is guaranteed to be listening -
#    in the HTTP response, or in a counter the panel publishes.
#
# docs/MEASURED.md carries what the exercise actually found.
CONFIG_EXCEPTION_DEBUG=y
CONFIG_FAULT_DUMP=2
CONFIG_THREAD_NAME=y
CONFIG_THREAD_MONITOR=y
CONFIG_INIT_STACKS=y
CONFIG_THREAD_ANALYZER=y
CONFIG_THREAD_ANALYZER_USE_PRINTK=y
# On demand only. Automatic sampling prints over everything else.
CONFIG_THREAD_ANALYZER_AUTO=n

# --- Entropy ----------------------------------------------------------------
CONFIG_ENTROPY_GENERATOR=y
CONFIG_CSPRNG_NEEDED=y

# --- Networking -------------------------------------------------------------
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_TCP=y
CONFIG_NET_UDP=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_DHCPV4=y
# Address conflict detection, RFC 5227. Without it a duplicate address is
# invisible: the DHCP ACK is accepted and the clash never appears in any log.
# Costs 4-7 s before the address is usable - ARP probes, then an announce wait.
CONFIG_NET_IPV4_ACD=y
# MEASURED 2026-11-18, 75 s after a cold boot: conn_mgr_monitor was at
# 472 / 512 (92%) and tcp_work at 888 / 1024 (86%), both on Zephyr defaults.
# Neither had failed, which is why they needed measuring rather than waiting
# for. `kernel thread stacks` is where these numbers come from.
CONFIG_NET_CONNECTION_MANAGER_MONITOR_STACK_SIZE=1024
CONFIG_NET_TCP_WORKQ_STACK_SIZE=1536
CONFIG_NET_CONNECTION_MANAGER=y
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_L2_ETHERNET=y
# Two interfaces, so two IPv4 configs. At the default of 1 they race and the
# loser reports "IPv4 not enabled for this interface".
CONFIG_NET_IF_MAX_IPV4_COUNT=2
# WiFi is the default interface regardless of enumeration order, because a bind
# to INADDR_ANY resolves through the default one.
CONFIG_NET_DEFAULT_IF_WIFI=y
# After the PHY's reset regulator at 75, before NET_INIT_PRIO at 90. MDIO comes
# after the MAC because its node is a child of it. Measured; see docs/CONFIG.md.
CONFIG_ETH_INIT_PRIORITY=80
CONFIG_MDIO_INIT_PRIORITY=81
CONFIG_PHY_INIT_PRIORITY=82
# Sized for 4 concurrent clients, derived rather than maximized. A fragment is
# 128 bytes of payload plus a 28-byte descriptor, so each buffer costs 156, and
# a 1500-byte frame chains 12 of them.
#
# RX: 4 x 4 KB receive window = 128 fragments. 256 doubles that for ARP, DHCP,
# mDNS and the SMP/UDP transfer, which share the pool.
# TX: 4 x 8 KB send window = 256 fragments unacked worst case, plus margin.
#
# THE CEILING IS THE MALLOC ARENA, not the 512 KB. COMMON_LIBC_MALLOC_ARENA_SIZE
# is -1, so the arena is whatever RAM is left over. At the previous 1024/512 the
# arena was down to about 2.5 KB; raising these takes it silently.
#
# The previous maximum (1024/512) was a test, not a setting. It did NOT fix the
# intermittent OTA stall - see docs/MEASURED.md.
CONFIG_NET_PKT_RX_COUNT=64
CONFIG_NET_PKT_TX_COUNT=64
CONFIG_NET_BUF_RX_COUNT=256
CONFIG_NET_BUF_TX_COUNT=320
# Declared, not derived. At 0 the window is NET_BUF_*_COUNT * 128 / 3, so it
# moved whenever the pool moved: at 1024 it advertised 43 KB per connection
# against a 131 KB pool, oversubscribed 4 ways.
CONFIG_NET_TCP_MAX_RECV_WINDOW_SIZE=4096
CONFIG_NET_TCP_MAX_SEND_WINDOW_SIZE=8192
# One connection handler per listening socket, and the default was one short.
CONFIG_NET_MAX_CONN=16
CONFIG_NET_MAX_CONTEXTS=16
CONFIG_NET_SHELL=y
CONFIG_WIFI=y
CONFIG_WIFI_AIROC=y
# Both set explicitly: Kconfig.defconfig selects them only `if BT`.
CONFIG_CYW4343W=y
CONFIG_CYW4343W_MURATA_1DX=y
CONFIG_WIFI_CREDENTIALS=y
# Credentials live in NVS, never in this build. See docs/PROVISIONING.md.
CONFIG_WIFI_CREDENTIALS_STATIC=n
CONFIG_WIFI_CREDENTIALS_BACKEND_SETTINGS=y
CONFIG_NET_L2_WIFI_SHELL=y
CONFIG_WHD_WIFI_COUNTRY="WHD_COUNTRY_UNITED_STATES"

# --- Discovery: portentaexplorer.local --------------------------------------
# RESPONDER, not RESOLVER: this answers for its own name.
CONFIG_MDNS_RESPONDER=y
CONFIG_DNS_SD=y
CONFIG_NET_HOSTNAME_ENABLE=y
# Lowercase, and NOT NET_HOSTNAME_UNIQUE - the name must be predictable.
CONFIG_NET_HOSTNAME="portentaexplorer"
CONFIG_ZVFS_EVENTFD_MAX=4

# --- C++, for the template engine -------------------------------------------
# One translation unit is C++: src/page_vars.cpp, the HtmlTpl registry.
CONFIG_CPP=y
CONFIG_STD_CPP17=y
CONFIG_CPP_EXCEPTIONS=n
CONFIG_CPP_RTTI=n

# --- HTTP server ------------------------------------------------------------
CONFIG_HTTP_SERVER=y
# Request headers are readable only in the first callback, so they are captured.
CONFIG_HTTP_SERVER_CAPTURE_HEADERS=y
# 64, AND 32 SILENTLY BROKE THE UPLOAD TOKEN. This sizes one buffer that the
# parser reuses for a header's NAME and then its VALUE, so the limit applies to
# whichever is longer. The API token is 32 characters, which needs 33 bytes with
# its terminator, so on_header_value discarded it at LOG_DBG level and the
# header was simply never captured - POST /ota then refused every upload for a
# missing token. The macro's BUILD_ASSERT only checks the name, so the build
# was clean. Measured 2026-11-18.
CONFIG_HTTP_SERVER_MAX_HEADER_LEN=64
# The POST path puts hex[514] and raw[256] on this stack for a 256-byte RS485
# frame, so 4096 no longer has margin.
CONFIG_HTTP_SERVER_STACK_SIZE=8192
CONFIG_HTTP_SERVER_VERSION_2=n
# Four clients, each one a measured 1.57 KB of the static server context. The
# page is one self-contained document, so a browser holds one connection, not
# one per asset. A fifth client is accepted and closed immediately.
CONFIG_HTTP_SERVER_MAX_CLIENTS=4
# The streams array is allocated whether or not HTTP/2 is on, and it is off.
CONFIG_HTTP_SERVER_MAX_STREAMS=1
# A 256-byte RS485 frame posts as 512 hex characters, so the request line plus
# that body no longer fits in 512.
CONFIG_HTTP_SERVER_CLIENT_BUFFER_SIZE=1024
CONFIG_ZVFS_POLL_MAX=16

# --- Carrier I/O subsystems -------------------------------------------------
CONFIG_I2C=y
CONFIG_ADC=y
CONFIG_GPIO=y
CONFIG_MDIO_SHELL=y
CONFIG_I2C_SHELL=y
CONFIG_ADC_SHELL=y
CONFIG_GPIO_SHELL=y

# --- Flash, filesystem, settings --------------------------------------------
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_STREAM_FLASH=y
CONFIG_MPU_ALLOW_FLASH_WRITE=y
# Silences SD retry noise on a board with no card. This DOES hide real errors.
CONFIG_SDHC_LOG_LEVEL_OFF=y
CONFIG_FILE_SYSTEM=y
CONFIG_FILE_SYSTEM_LITTLEFS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y
CONFIG_NVS=y

# --- Device management: SMP over UDP ----------------------------------------
CONFIG_ZCBOR=y
CONFIG_MCUMGR=y
CONFIG_MCUMGR_TRANSPORT_UDP=y
# Not automatic: the socket must be opened after an address exists, not at boot.
CONFIG_MCUMGR_TRANSPORT_UDP_AUTOMATIC_INIT=n
CONFIG_MCUMGR_GRP_IMG=y
CONFIG_MCUMGR_GRP_OS=y
CONFIG_MCUMGR_TRANSPORT_NETBUF_SIZE=2048
CONFIG_IMG_MANAGER=y
CONFIG_IMG_ERASE_PROGRESSIVELY=y

# --- MCUboot ----------------------------------------------------------------
CONFIG_BOOTLOADER_MCUBOOT=y
# Must match the bootloader's own swap mode. Watch the three near-identical
# symbol names - the wrong one makes MCUboot refuse every update in silence.
CONFIG_MCUBOOT_BOOTLOADER_MODE_SWAP_SCRATCH=y
CONFIG_MCUBOOT_IMGTOOL_SIGN_VERSION="0.98.0"

# --- Real-time clock --------------------------------------------------------
CONFIG_RTC=y

# --- Analog out -------------------------------------------------------------
CONFIG_PWM=y

# --- NTP, and the DNS it needs to find a server -----------------------------
# A hostname is the only option here, not merely the nicer one.
CONFIG_DNS_RESOLVER=y
CONFIG_NET_DHCPV4_OPTION_DNS_ADDRESS=y
# Zephyr defaults to 1, and DHCP hands out a primary and a backup. With 1 the
# backup is parsed and discarded, so a dead primary means no resolution at all.
# Each server costs one network context out of CONFIG_NET_MAX_CONTEXTS.
CONFIG_DNS_RESOLVER_MAX_SERVERS=2
CONFIG_SNTP=y

# --- Temperature ------------------------------------------------------------
CONFIG_SPI=y
CONFIG_SENSOR=y
CONFIG_MAX31855=y
CONFIG_MAX31865=y

# --- RS485 / RS232 ----------------------------------------------------------
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
# Runtime baud changes, for the rate sweep and the panel's baud selector.
CONFIG_UART_USE_RUNTIME_CONFIGURE=y

# --- Network pool instrumentation -------------------------------------------
# These are how a buffer theory gets tested instead of argued.
CONFIG_NET_BUF_POOL_USAGE=y
CONFIG_NET_STATISTICS=y
CONFIG_NET_STATISTICS_USER_API=y
CONFIG_NET_STATISTICS_WIFI=y
CONFIG_NET_STATISTICS_UDP=y

# --- SMP transport buffers --------------------------------------------------
# Costs 2 x NETBUF_SIZE, so 4 kB here.
CONFIG_MCUMGR_TRANSPORT_NETBUF_COUNT=4
